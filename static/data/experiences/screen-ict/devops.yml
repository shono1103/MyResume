id: devops
title: DevOps活動
slug: devops
summary: 半導体製造装置の制御ソフトウェア開発を支える活動として、ビルド・デバッグ環境の整備、CI/CD環境の構築、開発ドキュメントの公開・共有に取り組みました。
member: 各活動1人
role: [開発環境改善, プロトタイプ開発, インフラ構築, ドキュメント作成]
tech:
  os: [Windows, Ubuntu 20.04 LTS, WSL2]
  lang: [C++, Shell, Python]
  infra: [GitLab, Docker, Redmine, MkDocs]
activities:
  - Dockerによるビルド環境の整備：Dockerの導入を推進し、開発・ビルド環境を統合。Docker Desktopを使用しない構成を調査し、新規参入者向けの導入手順を作成してチームに展開しました。
  - 単体プログラムのデバッグ環境開発：1か月でプロトタイプを作成。既存の設定ファイル読み込み処理を再利用し、WindowsからWSL2上のDockerコンテナへTCPでデータを転送する仕組みと、GDBのレジスタ操作による関数のスタブ化を用いて、ソースコードを追跡できる単体デバッグ環境を構築しました。
  - オンプレGitLab RunnerによるCI/CD環境構築：1週間で対応。WSL2とDocker上にGitLab CE・GitLab Runnerを構築し、CI/CDパイプラインを検証。導入時の検証負荷を抑え、運用を再現できるよう構築手順をドキュメント化しました。
  - オンプレGitLab Pagesによるドキュメント公開：1週間で対応。新規参入者向けドキュメントを社内ネットワークに自動公開する環境を構築。mkdocs.ymlの自動生成とビルド時のPlantUML画像生成を実装し、再現手順を整備するとともに、若手社員へのドキュメント作成の呼びかけを行いました。
result:
  - Dockerによるビルド環境の効率化：実装＆ビルド作業効率 → 1/3、環境立ち上げ → 1/10以上
  - 単体プログラムのデバッグとソースコード追跡が可能な環境を構築
  - CI/CDとドキュメント公開の手順を標準化し、未管理ドキュメントの増殖を抑制
