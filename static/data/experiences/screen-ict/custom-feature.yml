id: custom-feature
title: 半導体製造装置のカスタム仕様開発
slug: semiconductor-custom-feature
summary: 本業務として、半導体製造の洗浄工程装置における制御ソフトウェアのカスタム仕様開発を担当しました。要求仕様書をもとに、外部仕様設計・内部仕様設計・実装・結合テスト・リリースに伴う作業に携わりました。
member: 30人以上
role: [システム設計, 詳細設計, 実装, 結合テスト, リリース]
tech:
  os: [vxworks, windows, wind river linux, ubuntu20.04lts]
  lang: [C++]
  infra: [gitlab, docker, redmine, subversion]
result:
  - 1年間で6案件を担当し、うち3案件はシステム設計から対応。
effort:
  - 既存のソースコードを読み解き、現状の動作を把握したうえで、要求仕様に合わせた設計・実装を行いました。
